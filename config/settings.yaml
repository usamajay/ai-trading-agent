mode: paper                      # research | paper | live (live is locked, see SPEC §9)
timezone_display: Asia/Karachi
symbols:
  XAUUSD: XAUUSDm                # internal name: broker symbol (Exness)
  USOIL: USOILm
timeframes: [M1, M5, M15, H1, H4, D1]
history_years: 3                 # M5..D1
m1_history_months: 6             # M1 is large, keep only recent months
storage:
  bars_dir: data/bars
  sqlite_path: data/tradeagent.db
entry_rules:
  min_ev_r: 0.15
  min_p_win_lower: 0.40
  min_sample_trades: 100
data_splits:                     # fixed, chronological; dates frozen in config/splits.yaml
  train: 0.60
  validation: 0.20
  out_of_sample: 0.20
backtest:                        # backtest engine (docs/PHASE_2_TASKS.md)
  embargo_weeks: 2               # unused gap between train / validation / out-of-sample
  max_hole_minutes: 60           # unreviewed unexpected gaps longer than this are excluded
  no_entry_minutes_after_open: 15  # no new entries right after any reopen (wide spreads)
  friday_cutoff_ny: "16:30"      # scalp/intraday: flat, no new entries from here (New York)
  exclusions_source_timeframe: M5  # finest timeframe with full history; holes found on it
  spread_margin_multiple: 1.1    # approved by Usama 2026-09-30 (tradeagent backtest spread-check)
  spread_margin_points: 0        # extra points added on top of the multiple
  slippage_spread_multiple: 0.2  # slippage on market/stop entries and stop-loss exits
  commission_per_lot_usd: 0.0    # round turn; Exness Standard has no commission
