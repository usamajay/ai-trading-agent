mode: paper                      # research | paper | live (live is locked, see SPEC §9)
timezone_display: Asia/Karachi
symbols:
  XAUUSD: XAUUSDm                # internal name: broker symbol (Exness)
  USOIL: USOILm
timeframes: [M1, M5, M15, H1, H4, D1]
history_years: 3                 # M5..D1
m1_history_months: 6             # M1 is large, keep only recent months
storage:
  bars_dir: data/bars
  sqlite_path: data/tradeagent.db
entry_rules:
  min_ev_r: 0.15
  min_p_win_lower: 0.40
  min_sample_trades: 100
  prior_strength: 20              # Beta prior pseudo-trades, centred on 50% (SPEC §5 shrinkage)
  credible_level: 0.90            # p_win interval; its lower bound is checked vs min_p_win_lower
data_splits:                     # fixed, chronological; dates frozen in config/splits.yaml
  train: 0.60
  validation: 0.20
  out_of_sample: 0.20
backtest:                        # backtest engine (docs/PHASE_2_TASKS.md)
  embargo_weeks: 2               # unused gap between train / validation / out-of-sample
  max_hole_minutes: 60           # unreviewed unexpected gaps longer than this are excluded
  no_entry_minutes_after_open: 15  # no new entries right after any reopen (wide spreads)
  friday_cutoff_ny: "16:30"      # scalp/intraday: flat, no new entries from here (New York)
  exclusions_source_timeframe: M5  # finest timeframe with full history; holes found on it
  spread_margin_multiple: 1.1    # approved by Usama 2026-09-30 (tradeagent backtest spread-check)
  spread_margin_points: 0        # extra points added on top of the multiple
  slippage_spread_multiple: 0.2  # slippage on market/stop entries and stop-loss exits
  commission_per_lot_usd: 0.0    # round turn; Exness Standard has no commission
  starting_balance: 10000        # USD, fixed for every backtest (Usama, 2026-09-30)
  cost_stress_multiple: 1.5      # stress re-run: spread (and so slippage) x 1.5 (SPEC §7.4)
llm:                             # Claude API hypothesis loop (Phase 6.7); key in .env
  model: claude-opus-5-5
  effort: high                   # thinking depth; counted inside max_output_tokens
  max_input_tokens: 40000        # prompt larger than this is refused
  max_output_tokens: 16000       # hard per-call output cap (thinking + JSON)
  input_usd_per_mtok: 4.00       # list price per million tokens (check when the model changes)
  output_usd_per_mtok: 20.00
  max_usd_per_run: 0.50          # worst case of one call must fit, else refused before sending
  max_usd_per_month: 5.00        # Usama's ~$5/month; recorded spend this UTC month + worst case
  max_hypotheses: 5              # SPEC §8
validation:                      # Phase 7 promotion gates (SPEC §7.4, §8.1); not risk limits
  wf_history_days: 365           # walk-forward: 12 months of history before the first test window
  wf_test_days: 91               # 3-month test windows
  wf_step_days: 91               # step 3 months
  wf_min_positive_share: 0.667   # >= 2 of 3 windows with expectancy > 0 after costs
  min_pf_candidate: 1.2          # research -> candidate: train profit factor
  min_pf_validation: 1.2         # candidate -> validated (with expectancy > 0, stress > 0)
  min_trades_train_val: 200
  min_trades_oos: 50
  min_pf_oos: 1.2
  sensitivity_pct: 20            # each parameter x0.8 and x1.2
  min_pf_sensitivity: 1.1
  mc_runs: 1000                  # trade-order shuffles
  mc_dd_multiple: 2.0            # 95th pct shuffled drawdown <= 2x backtest drawdown
  baseline_seeds: 100            # random baseline on the same split (p < 0.05 needs >= 19)
  baseline_p_max: 0.05
  dsr_min: 0.95                  # Deflated Sharpe Ratio (multiple-testing haircut)
