[project]
name = "tradeagent"
version = "0.1.0"
description = "Autonomous, risk-controlled trading research and paper-trading system"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5; sys_platform == 'win32'",
  "pandas",
  "numpy",
  "pyarrow",
  "pydantic",
  "pyyaml",
  "python-dotenv",
  "typer",
  "loguru",
]

[project.scripts]
tradeagent = "tradeagent.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Never let the formatter rewrite code samples inside docs (e.g. SPEC.md).
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
